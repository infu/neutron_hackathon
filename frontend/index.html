<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f5f8" />
    <meta
      name="description"
      content="The Neutron Hackathon - AI-powered, six-week seasons. Bring an agent, vibe-code an app for Neutron, and ship it."
    />
    <!-- Brand mark, generated by scripts/make-favicon.mjs. SVG first for
         anything modern; the PNG covers browsers that ignore SVG icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Self-hosted from the canister; preload the two faces that appear
         above the fold so they are ready before first paint. -->
    <link rel="preload" href="/fonts/spacegrotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/silkscreen.woff2" as="font" type="font/woff2" crossorigin />
    <title>Neutron Hackathon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
