      Layout: a left tree of nested permission groups with small expand
      chevrons and toggle pills, and a wide right pane showing a permission
      matrix — a grid of rows against columns with small filled and hollow
      status dots marking granted and denied.
      Visual style: near-white cool grey page background, pure white panels,
      hairline light grey borders, 4px corner radius, generous whitespace,
      completely flat with no gradients, no glow, no shadows, no 3D, no
      photographic elements. Single deep green accent colour used sparingly.
      CRITICAL: render every piece of text as soft light-grey rounded
