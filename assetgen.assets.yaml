  - id: shot-prism
    type: image
    mode: generate
    kind: hero-still
    size: [1536, 1024]
    finalSize: [768, 512]
    format: webp
    output: frontend/public/shots/prism.webp
    prompt: >-
      A clean, modern desktop app screenshot for a capability inspector — a
      tool showing exactly what an application is permitted to reach. Flat
