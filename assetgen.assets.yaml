      Flat vector style, no gradients, no bevel, no shadow, no border. The
      glyph is thick and simple enough to read clearly at 56 pixels.
      Absolutely no text, letters, numbers, or wordmark.

  - id: icon-lantern
    type: image
    mode: generate
