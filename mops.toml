[package]
name = "hackathon"
version = "0.1.0"
description = "Neutron Hackathon registration and participation canister"

[dependencies]
core = "1.0.0"
# Required by the vendored merkle tree in backend/lib/certification/.
# `ash` rejects mops versioned aliases (base@0, sha2@0), which is why
# ic-certification is vendored rather than depended on directly.
base = "0.14.14"
sha2 = "0.1.6"

[dev-dependencies]
test = "2.1.1"

[toolchain]
moc = "0.16.3"
